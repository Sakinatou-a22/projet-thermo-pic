<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Modélisation Thermodynamique</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .carte {
            background: white;
            border-radius: 16px;
            padding: 30px 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 { color: #1565c0; font-size: 1.6em; margin-bottom: 5px; text-align: center; }
        .sous-titre { color: #888; text-align: center; margin-bottom: 25px; font-size: 0.9em; }
        .flash-erreur {
            background: #ffebee; color: #b71c1c;
            padding: 10px 15px; border-radius: 8px;
            margin-bottom: 15px; border-left: 4px solid #b71c1c;
            font-size: 0.9em;
        }
        .flash-succes {
            background: #e8f5e9; color: #2e7d32;
            padding: 10px 15px; border-radius: 8px;
            margin-bottom: 15px; border-left: 4px solid #2e7d32;
            font-size: 0.9em;
        }
        label { display: block; color: #555; margin-bottom: 5px; font-weight: 500; font-size: 0.95em; }
        input {
            width: 100%; padding: 11px;
            border: 2px solid #e3f2fd; border-radius: 8px;
            font-size: 1em; margin-bottom: 15px;
        }
        input:focus { border-color: #1565c0; outline: none; }
        .btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #1565c0, #0d47a1);
            color: white; border: none; border-radius: 10px;
            font-size: 1.05em; font-weight: bold; cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }
        .lien { text-align: center; margin-top: 18px; color: #888; font-size: 0.9em; line-height: 2; }
        .lien a { color: #1565c0; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
<div class="carte">
    <h1>🔬 Connexion</h1>
    <p class="sous-titre">Modélisation Thermodynamique — PIC</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" placeholder="votre@email.com" required>
        <label>Mot de passe</label>
        <input type="password" name="mot_de_passe" placeholder="••••••••" required>
        <button type="submit" class="btn">Se connecter</button>
    </form>

    <div class="lien">
        Pas encore de compte ? <a href="/inscription">S'inscrire</a><br>
        <a href="/mot-de-passe-oublie">Mot de passe oublié ?</a>
    </div>
</div>
</body>
</html>
